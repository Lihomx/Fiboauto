# .streamlit/config.toml
# Fibo_auto Global Scanner v2.0 — Streamlit 主题配置

[theme]
base = "dark"
primaryColor         = "#f0b429"   # 金色主色调
backgroundColor      = "#0a0c10"   # 深黑背景
secondaryBackgroundColor = "#111827"
textColor            = "#e2e8f0"
font                 = "monospace"

[server]
headless      = true
enableCORS    = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
